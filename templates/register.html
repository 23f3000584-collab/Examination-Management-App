{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card card-body">
      <h4>Register</h4>
      <form method="post">
        <div class="mb-3">
          <input type="radio" name="role" value="examiner" id="r1" required>
          <label for="r1">Examiner (needs admin approval)</label>
          <input type="radio" name="role" value="student" id="r2" class="ms-3" checked>
          <label for="r2">Student</label>
        </div>
        <label class="form-label">Full name</label>
        <input class="form-control mb-2" name="name" placeholder="e.g. Rohan Verma" required>
        <label class="form-label">Email</label>
        <input class="form-control mb-2" type="email" name="email" required>
        <label class="form-label">Password</label>
        <input class="form-control mb-2" type="password" name="password" required>
        <label class="form-label">Phone</label>
        <input class="form-control mb-2" name="phone" placeholder="e.g. 9876543210">
        <label class="form-label">Department</label>
        <input class="form-control mb-3" name="department" placeholder="e.g. Computer Science">
        <button class="btn btn-primary w-100">Register</button>
      </form>
      <p class="mt-3 mb-0">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
    </div>
  </div>
</div>
{% endblock %}
