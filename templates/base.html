<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Examination Management Portal</title>
  <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-3">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('home') }}">Examination Management Portal</a>
    {% if me %}
      <span class="text-white small">{{ me.name }} ({{ me.role }})</span>
      <a class="btn btn-sm btn-outline-light ms-3" href="{{ url_for('logout') }}">Logout</a>
    {% endif %}
  </div>
</nav>
<div class="container pb-4">
  {% for message in get_flashed_messages() %}
    <div class="alert alert-info">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</div>
</body>
</html>
